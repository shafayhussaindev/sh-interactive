<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFBFC" />
    <meta name="google-site-verification" content="eabcjI0fxHzFO1JCN-jiCXDEYJRnHD383X6q-fMytzQ" />
    <meta name="description" content="Shafay Hussain is a software engineer and full-stack web developer in Pakistan, building custom websites, web apps and business software for clients worldwide." />
    <title>Shafay Hussain — Software Engineer &amp; Web Developer | SH // Interactive</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Link previews (WhatsApp, LinkedIn, X…). %SITE_URL% is filled in at build time, see vite.config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SH // Interactive" />
    <meta property="og:title" content="Shafay Hussain — Software Engineer &amp; Web Developer | SH // Interactive" />
    <meta property="og:description" content="Shafay Hussain is a software engineer and full-stack web developer in Pakistan, building custom websites, web apps and business software for clients worldwide." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: tells search engines who runs the site, what it offers and where the profiles are. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "%SITE_URL%/#business",
            "name": "SH Interactive",
            "alternateName": "SH // Interactive",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og.png",
            "logo": "%SITE_URL%/favicon.svg",
            "description": "Software engineering and web development studio: custom websites, full-stack web apps, e-commerce, business software and creative services.",
            "email": "shafay666@hotmail.com",
            "telephone": "+92 344 6644032",
            "address": { "@type": "PostalAddress", "addressCountry": "PK" },
            "areaServed": "Worldwide",
            "founder": { "@id": "%SITE_URL%/#shafay" },
            "sameAs": ["https://github.com/shafayhussaindev", "https://www.linkedin.com/in/shafay-h-b6ab61378"],
            "knowsAbout": ["Software engineering", "Web development", "React", "Full-stack development", "Business software", "E-commerce", "3D modeling"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Website Development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Full-Stack Web App Development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce Development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Admin Panels and Dashboards" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Business Software (POS, Inventory, Booking)" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Voiceover" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Logo and Brand Identity Kits" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Image Generation" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "3D Modeling" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Video Generation" } }
              ]
            }
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#shafay",
            "name": "Shafay Hussain",
            "jobTitle": "Software Engineer",
            "url": "%SITE_URL%/",
            "worksFor": { "@id": "%SITE_URL%/#business" },
            "sameAs": ["https://github.com/shafayhussaindev", "https://www.linkedin.com/in/shafay-h-b6ab61378"]
          },
          { "@type": "WebSite", "name": "SH Interactive", "url": "%SITE_URL%/" }
        ]
      }
    </script>
    <script>document.documentElement.classList.add('js')</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />

  </head>
